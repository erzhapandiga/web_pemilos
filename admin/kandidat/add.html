<h3 class="pl-5 pt-5 pb-3">Tambah Kandidat</h3>
<hr class="ml-5 mr-2" />

<!-- Banner Notifikasi Alert -->
<div id="alertBanner" class="hidden ml-5 mr-2 mb-3 px-4 py-3 rounded-xl text-sm font-semibold"></div>

<div class="row">
    <div class="col-md-8">
        <!-- Form menggunakan ID untuk ditangkap JavaScript -->
        <form id="formTambahKandidat" class="ml-4" method="post" enctype="multipart/form-data" class="form-horizontal">
            <table class="table table-borderless">
                <tr>
                    <td> No Kandidat </td>
                    <td> <input type="number" id="no_k" name="no_k" class="form-control" required /> </td>
                </tr>
                <tr>
                    <td> Nama Kandidat </td>
                    <td> <input type="text" autocomplete="off" id="nama" name="nama" class="form-control" required /> </td>
                </tr>
                <tr>
                    <td> Foto Kandidat </td>
                    <td> <input type="file" id="foto" name="foto" class="form-control" accept="image/*" required /> </td>
                </tr>
                <tr>
                    <td> Detail Data Calon </td>
                    <td> 
                        <textarea id="detail_data" name="detail_data" rows="4" class="form-control" style="display: block !important; width: 100% !important; height: auto !important; min-height: 90px !important; padding: 10px !important; opacity: 1 !important;" placeholder="Masukkan detail data calon (misal: Tempat/Tanggal Lahir, Kelas, dll)" required></textarea> 
                    </td>
                </tr>
                <tr>
                    <td> Visi </td>
                    <td> <textarea id="visi" name="visi" rows="3" class="form-control" style="display: block !important; width: 100% !important; height: auto !important; min-height: 80px !important; padding: 10px !important; opacity: 1 !important;" required></textarea> </td>
                </tr>
                <tr>
                    <td> Misi </td>
                    <td> <textarea id="misi" name="misi" rows="3" class="form-control" style="display: block !important; width: 100% !important; height: auto !important; min-height: 80px !important; padding: 10px !important; opacity: 1 !important;" required></textarea> </td>
                </tr>
                <tr>
                    <td> Program </td>
                    <td> <textarea id="program" name="program" rows="3" class="form-control" style="display: block !important; width: 100% !important; height: auto !important; min-height: 80px !important; padding: 10px !important; opacity: 1 !important;" required></textarea> </td>
                </tr>
            </table>

            <div class="form-group ml-1 pb-2" style="padding-top:20px;">
                <div class="col-md-offset-3 col-md-8">
                    <button type="submit" id="btnSubmit" class="btn btn-success">
                        Tambah Kandidat
                    </button>
                    <button type="button" onclick="window.history.go(-1)" class="btn btn-danger">
                        Kembali
                    </button>
                </div>
            </div>

        </form>
    </div>
</div>

<script>
    // Script JavaScript pengganti simpan.php untuk Vercel Serverless
    document.getElementById('formTambahKandidat').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btnSubmit = document.getElementById('btnSubmit');
        const alertBanner = document.getElementById('alertBanner');
        
        btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Menyimpan...';
        btnSubmit.disabled = true;
        alertBanner.classList.add('hidden');

        // Menggunakan FormData karena form mengirimkan file foto (multipart/form-data)
        const formData = new FormData(this);

        try {
            const response = await fetch('/api/tambah_kandidat', {
                method: 'POST',
                body: formData // Kirim langsung data form (termasuk file) ke Vercel API
            });

            const data = await response.json();

            alertBanner.className = 'ml-5 mr-2 mb-3 px-4 py-3 rounded-xl text-sm font-semibold ' + 
                (data.success ? 'bg-emerald-500/10 border border-emerald-500/50 text-emerald-400' : 'bg-red-500/10 border border-red-500/50 text-red-400');
            alertBanner.textContent = data.message;
            alertBanner.classList.remove('hidden');

            if (data.success) {
                setTimeout(() => {
                    window.location.href = 'kandidat.html'; // Arahkan kembali ke daftar kandidat
                }, 1500);
            }
        } catch (error) {
            alertBanner.className = 'ml-5 mr-2 mb-3 px-4 py-3 rounded-xl text-sm font-semibold bg-red-500/10 border border-red-500/50 text-red-400';
            alertBanner.textContent = 'Gagal terhubung ke server database.';
            alertBanner.classList.remove('hidden');
        }

        btnSubmit.innerHTML = 'Tambah Kandidat';
        btnSubmit.disabled = false;
    });
</script>
